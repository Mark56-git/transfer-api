name = "unlimited-transfer-api"
main = "src/worker.js"
compatibility_date = "2026-09-04"

# 开启日志，这样报错时能看到具体原因
[observability]
enabled = true

[vars]
# 建议改成一个真实存在的模型，或者留空让代码使用内置默认值
# 如果要用 Gemini，必须是你 GEMINI_MODELS 里定义的 key，比如 "gemini-flash"
DEFAULT_MODEL = "gemini-flash" 
DEFAULT_CLAUDE_MODEL = "claude-3-5-sonnet-20241022"
